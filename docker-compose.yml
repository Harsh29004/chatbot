version: "3.9"

services:
  faq-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ADMIN_API_KEY=${ADMIN_API_KEY:-admin-change-me}
      - STRONG_MATCH_THRESHOLD=${STRONG_MATCH_THRESHOLD:-0.85}
      - NEAR_MATCH_THRESHOLD=${NEAR_MATCH_THRESHOLD:-0.60}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - SQLITE_DB_PATH=/app/data/logs/faq_bot.db
    volumes:
      - chroma-data:/app/data/chroma
      - sqlite-data:/app/data/logs
      - ./apps/customer_bot/data:/app/apps/customer_bot/data
      - ./apps/partner_bot/data:/app/apps/partner_bot/data
    restart: unless-stopped

volumes:
  chroma-data:
  sqlite-data:
